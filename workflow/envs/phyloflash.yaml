name: orochi_phyloflash
channels:
  - conda-forge
  - bioconda
dependencies:
  # Individual tools phyloFlash.pl needs for its default (non-EMIRGE) workflow,
  # pinned in place of the bioconda `phyloflash` package (which unconditionally
  # pulls in emirge). phyloFlash.pl itself is fetched from GitHub as a workflow
  # resource -- see the download_phyloflash rule in mag_linkage.smk.
  - perl>=5.13.2
  - bbmap
  - vsearch>=2.5.0
  - bedtools
  - mafft
  - pigz
  - samtools>=1.12
  - spades=3.15.5